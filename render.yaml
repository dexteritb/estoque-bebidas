# Render Blueprint — sobe o web service + o banco Postgres juntos.
# Deploy > New > Blueprint no dashboard do Render, apontando pro repositório
# que contém este arquivo. Veja o README.md para o passo a passo completo.
#
# IMPORTANTE: o plano "free" do Postgres do Render EXPIRA 30 dias depois de
# criado (perde os dados). Pra um sistema de estoque de verdade, troque
# "plan: free" do banco abaixo para "basic-256mb" (pago, ~US$6-7/mês) antes
# de usar em produção — ou use um Postgres externo permanente e grátis (ex:
# Neon) colando a connection string manualmente na variável DATABASE_URL do
# serviço web, sem precisar do banco do Render.

databases:
  - name: estoque-bebidas-db
    plan:  basic-256mb
    databaseName: estoque_bebidas
    user: estoque_admin

services:
  - type: web
    name: estoque-bebidas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-bebidas-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
